name: annda
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Everything else comes from pip on purpose: conda-forge numpy and pip torch
  # each bundle their own libomp, and loading both aborts the process with
  # "OMP: Error #15: Initializing libomp.dylib, but found libomp.dylib already
  # initialized." Keeping the whole numeric stack on one wheel source avoids it.
  - pip:
      - numpy
      - matplotlib
      - pandas
      - torch
      - keras
      - jupyter
      - ipykernel
